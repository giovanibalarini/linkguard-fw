name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Compute version
        id: version
        run: |
          # Reuse a semantic version tag already pointing at this commit.
          if TAG=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n1); then
            if [ -n "${TAG}" ]; then
              VERSION="${TAG}"
            else
              LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)

              if [ -z "${LAST_TAG}" ]; then
                VERSION="v1.0.0"
              else
                MAJOR=$(echo "${LAST_TAG}" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\1/')
                MINOR=$(echo "${LAST_TAG}" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\2/')
                PATCH=$(echo "${LAST_TAG}" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\3/')
                PATCH=$((PATCH + 1))
                VERSION="v${MAJOR}.${MINOR}.${PATCH}"
              fi
            fi
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "deb_version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Run tests
        run: go test ./...

      - name: Build Go binaries
        run: |
          mkdir -p dist
          for ARCH in amd64 arm64; do
            echo ">>> Building linux/${ARCH}..."
            GOOS=linux GOARCH="${ARCH}" go build \
              -ldflags="-X main.version=${{ steps.version.outputs.version }} -s -w" \
              -o "dist/linkguard-fw-linux-${ARCH}" \
              ./cmd/linkguard-fw/
          done

      # O empacotamento é delegado ao Makefile de propósito: ele é a fonte
      # única do DEBIAN/control (ver DEB_RECOMMENDS lá). Enquanto este passo
      # montava o próprio control, o .deb oficial — o que chega ao firewall
      # por release e por auto-update — continuava declarando
      # `Depends: nftables, iproute2, ...`, parando em `iU` numa máquina
      # pelada, que é exatamente o defeito que a mudança para Recommends:
      # existe para eliminar. TestControlFieldsAreSingleSourced
      # (internal/sysprep) quebra o build se alguém reintroduzir um control
      # aqui.
      - name: Build .deb packages
        run: |
          for ARCH in amd64 arm64; do
            make deb-from-binary \
              VERSION="${{ steps.version.outputs.deb_version }}" \
              DEB_ARCH="${ARCH}" \
              DEB_BINARY="dist/linkguard-fw-linux-${ARCH}"
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum \
            linkguard-fw-linux-amd64 \
            linkguard-fw-linux-arm64 \
            "linkguard-fw_${{ steps.version.outputs.deb_version }}_amd64.deb" \
            "linkguard-fw_${{ steps.version.outputs.deb_version }}_arm64.deb" \
            > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.version }}"
          DEB_VER="${{ steps.version.outputs.deb_version }}"

          cat > release-notes.md <<EOF
          Automated release from commit ${{ github.sha }}.

          ### Install via .deb (Debian/Ubuntu - recommended)

          \`\`\`bash
          # amd64
          wget https://github.com/${{ github.repository }}/releases/download/${TAG}/linkguard-fw_${DEB_VER}_amd64.deb
          sudo dpkg -i linkguard-fw_${DEB_VER}_amd64.deb

          # Edit config (set jwt_secret before starting)
          sudo nano /etc/linkguard-fw/config.json

          # Enable and start the service
          sudo systemctl enable --now linkguard-fw
          \`\`\`

          ### Install binary manually

          \`\`\`bash
          # amd64
          wget https://github.com/${{ github.repository }}/releases/download/${TAG}/linkguard-fw-linux-amd64
          chmod +x linkguard-fw-linux-amd64
          sudo mv linkguard-fw-linux-amd64 /usr/local/bin/linkguard-fw
          \`\`\`

          ### Verify checksums

          \`\`\`bash
          wget https://github.com/${{ github.repository }}/releases/download/${TAG}/sha256sums.txt
          sha256sum -c sha256sums.txt
          \`\`\`
          EOF

          FILES=(
            dist/linkguard-fw-linux-amd64
            dist/linkguard-fw-linux-arm64
            "dist/linkguard-fw_${DEB_VER}_amd64.deb"
            "dist/linkguard-fw_${DEB_VER}_arm64.deb"
            dist/sha256sums.txt
          )

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${FILES[@]}" --clobber
          else
            gh release create "${TAG}" "${FILES[@]}" \
              --title "LinkGuard FW ${TAG}" \
              --notes-file release-notes.md \
              --latest
          fi
