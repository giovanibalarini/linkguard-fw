name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Compute version
        id: version
        run: |
          # Reuse a semantic version tag already pointing at this commit.
          if TAG=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n1); then
            if [ -n "${TAG}" ]; then
              VERSION="${TAG}"
            else
              LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)

              if [ -z "${LAST_TAG}" ]; then
                VERSION="v1.0.0"
              else
                MAJOR=$(echo "${LAST_TAG}" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\1/')
                MINOR=$(echo "${LAST_TAG}" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\2/')
                PATCH=$(echo "${LAST_TAG}" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\3/')
                PATCH=$((PATCH + 1))
                VERSION="v${MAJOR}.${MINOR}.${PATCH}"
              fi
            fi
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "deb_version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Run tests
        run: go test ./...

      - name: Build Go binaries
        run: |
          mkdir -p dist
          for ARCH in amd64 arm64; do
            echo ">>> Building linux/${ARCH}..."
            GOOS=linux GOARCH="${ARCH}" go build \
              -ldflags="-X main.version=${{ steps.version.outputs.version }} -s -w" \
              -o "dist/linkguard-fw-linux-${ARCH}" \
              ./cmd/linkguard-fw/
          done

      # O empacotamento é delegado ao Makefile de propósito: ele é a fonte
      # única do DEBIAN/control (ver DEB_RECOMMENDS lá). Enquanto este passo
      # montava o próprio control, o .deb oficial — o que chega ao firewall
      # por release e por auto-update — continuava declarando
      # `Depends: nftables, iproute2, ...`, parando em `iU` numa máquina
      # pelada, que é exatamente o defeito que a mudança para Recommends:
      # existe para eliminar. TestControlFieldsAreSingleSourced
      # (internal/sysprep) quebra o build se alguém reintroduzir um control
      # aqui — inclusive se for emitido por um `printf` de uma linha só com
      # `\n` escapados, a forma que passava despercebida antes da revisão
      # final.
      - name: Build .deb packages
        run: |
          for ARCH in amd64 arm64; do
            make deb-from-binary \
              VERSION="${{ steps.version.outputs.deb_version }}" \
              DEB_ARCH="${ARCH}" \
              DEB_BINARY="dist/linkguard-fw-linux-${ARCH}"
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum \
            linkguard-fw-linux-amd64 \
            linkguard-fw-linux-arm64 \
            "linkguard-fw_${{ steps.version.outputs.deb_version }}_amd64.deb" \
            "linkguard-fw_${{ steps.version.outputs.deb_version }}_arm64.deb" \
            > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.version }}"
          DEB_VER="${{ steps.version.outputs.deb_version }}"

          # A nota sai do histórico (issue #63). Ela repetia o passo a passo de
          # instalação, que já mora no README e não muda de release para
          # release, e não dizia uma linha sobre o que tinha sido corrigido —
          # justamente o que decide, para quem opera um firewall, se a
          # atualização é para agora ou para o sábado.
          #
          # O checkout deste job usa fetch-depth: 0, e o script depende disso:
          # sem as tags e sem o histórico ele não tem de onde tirar a lista.
          bash scripts/release-notes.sh \
            "${TAG}" "${{ github.repository }}" "${{ github.sha }}" > release-notes.md

          echo "--- release-notes.md ---"
          cat release-notes.md

          FILES=(
            dist/linkguard-fw-linux-amd64
            dist/linkguard-fw-linux-arm64
            "dist/linkguard-fw_${DEB_VER}_amd64.deb"
            "dist/linkguard-fw_${DEB_VER}_arm64.deb"
            dist/sha256sums.txt
          )

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${FILES[@]}" --clobber
          else
            gh release create "${TAG}" "${FILES[@]}" \
              --title "LinkGuard FW ${TAG}" \
              --notes-file release-notes.md \
              --latest
          fi

          # A ESTEIRA CONFERE O QUE PUBLICOU, e não só se o comando saiu com
          # zero.
          #
          # A v1.0.158 saiu "success" com UM asset de cinco: os dois .deb foram
          # construídos, o sha256sums.txt foi gerado — está tudo no log deste
          # mesmo job — e só o binário arm64 apareceu na release. O `gh release
          # create` devolveu zero mesmo assim.
          #
          # Uma release verde sem pacote é pior do que uma release vermelha: o
          # deploy encontra a versão nova, não encontra o que instalar, e quem
          # olha o CI vê tudo em ordem. Este laço é o que impede "sucesso" de
          # significar outra coisa.
          echo "--- conferindo os assets publicados ---"
          PUBLICADOS="$(gh release view "${TAG}" --json assets -q '.assets[].name')"
          echo "${PUBLICADOS}"
          FALTANDO=()
          for f in "${FILES[@]}"; do
            nome="$(basename "${f}")"
            grep -qxF "${nome}" <<<"${PUBLICADOS}" || FALTANDO+=("${nome}")
          done
          if [ ${#FALTANDO[@]} -gt 0 ]; then
            echo "::error::a release ${TAG} ficou sem: ${FALTANDO[*]}"
            echo "Tentando subir de novo o que faltou..."
            gh release upload "${TAG}" "${FILES[@]}" --clobber
            PUBLICADOS="$(gh release view "${TAG}" --json assets -q '.assets[].name')"
            for nome in "${FALTANDO[@]}"; do
              grep -qxF "${nome}" <<<"${PUBLICADOS}" || {
                echo "::error::${nome} continua ausente depois da segunda tentativa"
                exit 1
              }
            done
            echo "Segunda tentativa completou a release."
          fi
