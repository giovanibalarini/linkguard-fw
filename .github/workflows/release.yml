name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Compute version
        id: version
        run: |
          # Reuse a semantic version tag already pointing at this commit.
          if TAG=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n1); then
            if [ -n "${TAG}" ]; then
              VERSION="${TAG}"
            else
              LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)

              if [ -z "${LAST_TAG}" ]; then
                VERSION="v1.0.0"
              else
                MAJOR=$(echo "${LAST_TAG}" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\1/')
                MINOR=$(echo "${LAST_TAG}" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\2/')
                PATCH=$(echo "${LAST_TAG}" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\3/')
                PATCH=$((PATCH + 1))
                VERSION="v${MAJOR}.${MINOR}.${PATCH}"
              fi
            fi
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "deb_version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Run tests
        run: go test ./...

      - name: Build Go binaries
        run: |
          mkdir -p dist
          for ARCH in amd64 arm64; do
            echo ">>> Building linux/${ARCH}..."
            GOOS=linux GOARCH="${ARCH}" go build \
              -ldflags="-X main.version=${{ steps.version.outputs.version }} -s -w" \
              -o "dist/linkguard-fw-linux-${ARCH}" \
              ./cmd/linkguard-fw/
          done

      - name: Build .deb packages
        run: |
            VERSION_CLEAN="${{ steps.version.outputs.deb_version }}"

            for ARCH in amd64 arm64; do
            PKG="linkguard-fw_${VERSION_CLEAN}_${ARCH}"
            PKG_DIR="dist/deb/${PKG}"

            mkdir -p "${PKG_DIR}/DEBIAN"
            mkdir -p "${PKG_DIR}/usr/local/bin"
            mkdir -p "${PKG_DIR}/lib/systemd/system"

            cp "dist/linkguard-fw-linux-${ARCH}" "${PKG_DIR}/usr/local/bin/linkguard-fw"
            chmod 0755 "${PKG_DIR}/usr/local/bin/linkguard-fw"

            cp deploy/linkguard-fw.service "${PKG_DIR}/lib/systemd/system/linkguard-fw.service"
            cp deploy/linkguard-notify-down.service "${PKG_DIR}/lib/systemd/system/linkguard-notify-down.service"

            cat > "${PKG_DIR}/DEBIAN/control" <<EOF
            Package: linkguard-fw
            Version: ${VERSION_CLEAN}
            Architecture: ${ARCH}
            Maintainer: giovanibalarini <giovanibalarini@users.noreply.github.com>
            Section: net
            Priority: optional
            Depends: nftables, iproute2, iptables, wireguard-tools, iputils-ping
            Recommends: kea-dhcp4-server, unbound, smartmontools, chrony
            Homepage: https://github.com/giovanibalarini/linkguard-fw
            Description: Linux Firewall Management Tool
             LinkGuard FW is a web-based firewall management tool for Linux
             that provides a modern UI to manage iptables rules, static routes,
             failover policies, and network monitoring.
            EOF

            install -m 0755 deploy/deb/postinst "${PKG_DIR}/DEBIAN/postinst"
            install -m 0755 deploy/deb/prerm    "${PKG_DIR}/DEBIAN/prerm"

            dpkg-deb --build --root-owner-group "${PKG_DIR}" "dist/${PKG}.deb"
            echo ">>> Created: dist/${PKG}.deb"
            done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum \
            linkguard-fw-linux-amd64 \
            linkguard-fw-linux-arm64 \
            "linkguard-fw_${{ steps.version.outputs.deb_version }}_amd64.deb" \
            "linkguard-fw_${{ steps.version.outputs.deb_version }}_arm64.deb" \
            > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.version }}"
          DEB_VER="${{ steps.version.outputs.deb_version }}"

          cat > release-notes.md <<EOF
          Automated release from commit ${{ github.sha }}.

          ### Install via .deb (Debian/Ubuntu - recommended)

          \`\`\`bash
          # amd64
          wget https://github.com/${{ github.repository }}/releases/download/${TAG}/linkguard-fw_${DEB_VER}_amd64.deb
          sudo dpkg -i linkguard-fw_${DEB_VER}_amd64.deb

          # Edit config (set jwt_secret before starting)
          sudo nano /etc/linkguard-fw/config.json

          # Enable and start the service
          sudo systemctl enable --now linkguard-fw
          \`\`\`

          ### Install binary manually

          \`\`\`bash
          # amd64
          wget https://github.com/${{ github.repository }}/releases/download/${TAG}/linkguard-fw-linux-amd64
          chmod +x linkguard-fw-linux-amd64
          sudo mv linkguard-fw-linux-amd64 /usr/local/bin/linkguard-fw
          \`\`\`

          ### Verify checksums

          \`\`\`bash
          wget https://github.com/${{ github.repository }}/releases/download/${TAG}/sha256sums.txt
          sha256sum -c sha256sums.txt
          \`\`\`
          EOF

          FILES=(
            dist/linkguard-fw-linux-amd64
            dist/linkguard-fw-linux-arm64
            "dist/linkguard-fw_${DEB_VER}_amd64.deb"
            "dist/linkguard-fw_${DEB_VER}_arm64.deb"
            dist/sha256sums.txt
          )

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${FILES[@]}" --clobber
          else
            gh release create "${TAG}" "${FILES[@]}" \
              --title "LinkGuard FW ${TAG}" \
              --notes-file release-notes.md \
              --latest
          fi
