# Postura — os dois cartões
fw.posture.forward.title:
  pt: "Tráfego que atravessa o firewall"
  en: "Traffic crossing the firewall"
fw.posture.forward.subtitle:
  pt: "O que sai da sua rede para a internet, e o que vai de uma rede para outra."
  en: "What leaves your network for the internet, and what goes from one network to another."
fw.posture.forward.accept:
  pt: "Tudo passa, menos o que você bloquear. É como o firewall está hoje."
  en: "Everything passes except what you block. This is how the firewall is today."
fw.posture.forward.drop:
  pt: "Nada passa, menos o que você liberar. O que você esquecer de listar fica bloqueado — não solto."
  en: "Nothing passes except what you allow. Anything you forget to list stays blocked — not loose."
fw.posture.forward.risk:
  pt: "A rede inteira para de sair até você liberar o que precisa. O acesso a este painel não é afetado."
  en: "Your whole network stops reaching out until you allow what it needs. Access to this panel is not affected."
fw.posture.input.title:
  pt: "Tráfego destinado ao próprio LinkGuard"
  en: "Traffic addressed to LinkGuard itself"
fw.posture.input.subtitle:
  pt: "Quem pode falar com esta máquina: este painel, SSH, o DNS e o DHCP que ela serve."
  en: "Who may talk to this machine: this panel, SSH, and the DNS and DHCP it serves."
fw.posture.input.accept:
  pt: "Qualquer máquina que alcance o LinkGuard pode tentar falar com ele."
  en: "Any machine that can reach LinkGuard may try to talk to it."
fw.posture.input.drop:
  pt: "Só o acesso administrativo listado abaixo continua chegando."
  en: "Only the administrative access listed below still gets through."
fw.posture.input.risk:
  pt: "Esta é a mudança que tranca o administrador do lado de fora. Se a lista abaixo não incluir o caminho que você usa, você perde o painel e o SSH ao mesmo tempo."
  en: "This is the change that locks the administrator out. If the list below does not include the path you use, you lose the panel and SSH at the same time."

# Postura — controles
fw.posture.choice.accept:
  pt: "Liberar por padrão"
  en: "Allow by default"
fw.posture.choice.drop:
  pt: "Bloquear por padrão"
  en: "Block by default"
fw.posture.badge.accept:
  pt: "Liberando por padrão"
  en: "Allowing by default"
fw.posture.badge.drop:
  pt: "Bloqueando por padrão"
  en: "Blocking by default"
fw.posture.badge.unknown:
  pt: "desconhecida"
  en: "unknown"
fw.posture.readError:
  pt: "Não consegui ler a postura atual do firewall."
  en: "I could not read the firewall's current posture."
fw.posture.readError.tail:
  pt: "A postura não é mostrada como “liberada” por causa disso — o firewall pode estar bloqueando."
  en: "The posture is not shown as “allowing” because of this — the firewall may well be blocking."
fw.posture.applied.drop:
  pt: "Postura alterada para bloquear. Teste o seu acesso e confirme na faixa acima."
  en: "Posture changed to blocking. Test your access and confirm in the banner above."
fw.posture.applied.accept:
  pt: "Postura alterada para liberar por padrão."
  en: "Posture changed to allowing by default."

# Postura — a lista de sobrevivência
fw.posture.survival.title:
  pt: "O que continua passando, sempre"
  en: "What always keeps getting through"
fw.posture.survival.subtitle:
  pt: "Com a postura em bloquear, estas linhas entram acima de tudo — senão “bloquear tudo” significaria bloquear você também. Elas vêm desta máquina, não de uma lista de exemplo."
  en: "With the posture set to block, these lines go above everything else — otherwise “block everything” would mean blocking you too. They come from this machine, not from an example list."
fw.posture.survival.error:
  pt: "Não consegui montar a lista desta chain: {erro}"
  en: "I could not build this chain's list: {erro}"
fw.posture.survival.established.what:
  pt: "Conexões que já estavam abertas"
  en: "Connections that were already open"
fw.posture.survival.established.why:
  pt: "Sem esta linha, bloquear não bloqueia “o que você não liberou”: derruba tudo, inclusive cada download e cada chamada em curso."
  en: "Without this line, blocking does not block “what you did not allow”: it drops everything, including every download and call in progress."
fw.posture.survival.related.what:
  pt: "Respostas de erro e controle das conexões"
  en: "Error and control replies for connections"
fw.posture.survival.related.why:
  pt: "É o que mantém o “pacote grande demais” chegando de volta. Sem ela, conexões travam pela metade sem mensagem nenhuma."
  en: "This is what keeps “packet too big” getting back to you. Without it, connections hang halfway with no message at all."
fw.posture.survival.dnat.what:
  pt: "Os seus encaminhamentos de porta"
  en: "Your port forwards"
fw.posture.survival.dnat.why:
  pt: "Sem esta linha, todo redirecionamento continua sendo traduzido e morre logo depois — o sintoma é “o encaminhamento parou”, sem nada apontando para o firewall."
  en: "Without this line, every redirect is still translated and dies right after — the symptom is “the forward stopped working”, with nothing pointing at the firewall."
fw.posture.survival.loopback.what:
  pt: "A própria máquina falando consigo"
  en: "The machine talking to itself"
fw.posture.survival.loopback.why:
  pt: "O painel escutando em 127.0.0.1 ficaria inalcançável até por um túnel SSH."
  en: "The panel listening on 127.0.0.1 would be unreachable even through an SSH tunnel."
fw.posture.survival.icmpv6.what:
  pt: "Descoberta de vizinhança IPv6"
  en: "IPv6 neighbour discovery"
fw.posture.survival.icmpv6.why:
  pt: "Sem ela o IPv6 morre inteiro, e só ele — o IPv4 continua bom, que é o que faz ninguém relacionar o sintoma com o firewall."
  en: "Without it IPv6 dies entirely, and only IPv6 — IPv4 keeps working, which is exactly why nobody connects the symptom to the firewall."
fw.posture.survival.admin.what:
  pt: "O seu acesso administrativo"
  en: "Your administrative access"
fw.posture.survival.admin.why:
  pt: "SSH e este painel, nas portas que esta máquina realmente usa."
  en: "SSH and this panel, on the ports this machine actually uses."
fw.posture.survival.dhcpServed.what:
  pt: "O DHCP que você serve à rede"
  en: "The DHCP you serve to your network"
fw.posture.survival.dhcpServed.why:
  pt: "Sem ele os aparelhos param de pegar IP — e quem estiver na rede vai dizer que “a internet caiu”."
  en: "Without it devices stop getting an IP — and everyone on the network will say “the internet is down”."
fw.posture.survival.dnsServed.what:
  pt: "O DNS que você serve à rede"
  en: "The DNS you serve to your network"
fw.posture.survival.dnsServed.why:
  pt: "Sem ele nada resolve nome, mesmo com a rede funcionando perfeitamente."
  en: "Without it nothing resolves names, even with the network working perfectly."
fw.posture.survival.dhcpClient.what:
  pt: "O firewall pegando o próprio endereço"
  en: "The firewall getting its own address"
fw.posture.survival.dhcpClient.why:
  pt: "A renovação de DHCP da WAN não passa por conntrack. O sintoma aparece dias depois de uma queda de link, como “a internet caiu sozinha na quarta”."
  en: "The WAN's DHCP renewal does not go through conntrack. The symptom shows up days after a link flap, as “the internet went down by itself on Wednesday”."

# Postura — as confirmações
fw.posture.confirm.drop:
  pt: "Bloquear {alvo} por padrão? A partir daí só passa o que você tiver liberado. Você tem 90 segundos para confirmar que ainda entra; se não confirmar, o LinkGuard desfaz sozinho."
  en: "Block {alvo} by default? From then on only what you have allowed gets through. You have 90 seconds to confirm you can still get in; if you do not confirm, LinkGuard undoes it by itself."
fw.posture.confirm.accept:
  pt: "Liberar {alvo} por padrão? Os seus bloqueios continuam valendo — o que muda é o que acontece com o tráfego que nenhuma regra menciona."
  en: "Allow {alvo} by default? Your blocks stay in force — what changes is what happens to traffic no rule mentions."
fw.posture.target.forward:
  pt: "o tráfego que ATRAVESSA o firewall"
  en: "traffic CROSSING the firewall"
fw.posture.target.input:
  pt: "o acesso AO próprio LinkGuard"
  en: "access TO LinkGuard itself"

# Comuns a várias telas
common.loading:
  pt: "Carregando..."
  en: "Loading..."

# Faixa do confirmar-ou-reverte — a rede de segurança. O texto aqui é o que
# impede o operador de se trancar fora, então cada frase é traduzida inteira,
# nunca montada por concatenação.
fw.confirm.countdown:
  pt: "reverte em"
  en: "reverts in"
fw.confirm.title:
  pt: "Esta alteração mexe no tráfego destinado ao próprio firewall e aguarda confirmação."
  en: "This change affects traffic addressed to the firewall itself and is awaiting confirmation."
fw.confirm.appliedBy:
  pt: " · aplicada por "
  en: " · applied by "
fw.confirm.unknownUser:
  pt: "desconhecido"
  en: "unknown"
fw.confirm.testAccess:
  pt: "Teste o acesso que importa — SSH, este painel — antes de confirmar. Se ficou de fora, não faça nada:"
  en: "Test the access that matters — SSH, this panel — before confirming. If you got locked out, do nothing:"
fw.confirm.deadlinePassed:
  pt: "o prazo acabou e a reversão automática está a caminho."
  en: "the deadline has passed and the automatic revert is on its way."
fw.confirm.deadlineRunning:
  pt: "o LinkGuard reverte sozinho quando o prazo acabar."
  en: "LinkGuard reverts by itself when the deadline runs out."
fw.confirm.newConnectionsOnly:
  pt: "Este grupo vale só para conexões novas."
  en: "This group only applies to new connections."
fw.confirm.newConnectionsOnly.strong:
  pt: "A sua sessão atual não é afetada"
  en: "Your current session is not affected"
fw.confirm.newConnectionsOnly.tail:
  pt: "— abra uma conexão nova (outro terminal SSH, uma aba anônima) para testar de verdade antes de confirmar."
  en: "— open a fresh connection (another SSH terminal, a private tab) to really test before confirming."
fw.confirm.needWrite:
  pt: "Confirmar e reverter exigem permissão de escrita no firewall. Chame quem tem — ou espere o prazo, que reverte sozinho."
  en: "Confirming and reverting require firewall write permission. Call someone who has it — or wait for the deadline, which reverts on its own."
fw.confirm.staleRead:
  pt: "O painel não conseguiu reler o estado desta janela agora — o que está acima é a última leitura boa. Continua tentando."
  en: "The panel could not re-read this window's state just now — what you see above is the last good reading. It keeps trying."
fw.confirm.reverting.title:
  pt: "A reversão está em curso — e você já pode editar normalmente."
  en: "The revert is under way — and you can already edit normally."
fw.confirm.reverting.body:
  pt: "Os grupos e as regras já voltaram ao estado anterior aqui no LinkGuard; falta o firewall aceitar a reconfiguração, e ele repete a tentativa até conseguir. Não há o que confirmar: esta alteração não vai mais valer."
  en: "The groups and rules are already back to their previous state here in LinkGuard; what remains is for the firewall to accept the reconfiguration, and it retries until it succeeds. There is nothing to confirm: this change will no longer take effect."
fw.confirm.reverting.editable:
  pt: "A edição continua liberada: se foi uma regra que fez o firewall recusar, é editando ou apagando ela que você resolve — a sua próxima alteração aplica os dois estados de uma vez."
  en: "Editing stays unlocked: if a rule is what made the firewall refuse, editing or deleting it is how you fix this — your next change applies both states at once."
fw.confirm.reverting.scope:
  pt: "A reversão desfaz apenas grupos e regras. Bloqueios por host, encaminhamentos de porta e o NTP continuam como estão."
  en: "The revert only undoes groups and rules. Host blocks, port forwards and NTP stay as they are."
fw.confirm.unknown.title:
  pt: "Não foi possível saber se há alguma alteração aguardando confirmação."
  en: "It was not possible to tell whether any change is awaiting confirmation."
fw.confirm.unknown.body:
  pt: "A consulta ao LinkGuard falhou. Isto não quer dizer que não há nada pendente — quer dizer que não sabemos. Se você acabou de aplicar uma alteração de escopo input, ela pode estar contando os 90 segundos agora."
  en: "The query to LinkGuard failed. This does not mean nothing is pending — it means we do not know. If you have just applied an input-scoped change, it may be counting down its 90 seconds right now."
fw.confirm.retry:
  pt: "Tentar de novo"
  en: "Try again"

# Vocabulário compartilhado dos grupos (groupMeta). Os keywords do nftables
# (accept/drop/reject/continue, forward/input, ct state new) NÃO entram aqui:
# eles são o que o admin acha no `nft list ruleset` e não se traduzem. O que
# se traduz é a frase ao lado, que carrega o significado.
fw.action.accept.hint:
  pt: "deixa passar"
  en: "lets it through"
fw.action.drop.hint:
  pt: "descarta em silêncio"
  en: "drops it silently"
fw.action.reject.hint:
  pt: "recusa e avisa a origem"
  en: "refuses and tells the sender"
fw.fallthrough.continue.hint:
  pt: "não decide nada; a avaliação segue adiante"
  en: "decides nothing; evaluation carries on"
fw.fallthrough.accept.hint:
  pt: "deixa passar tudo o que sobrou"
  en: "lets through everything left over"
fw.fallthrough.drop.hint:
  pt: "descarta em silêncio tudo o que sobrou"
  en: "silently drops everything left over"
fw.scope.forward.title:
  pt: "atravessando o firewall"
  en: "crossing the firewall"
fw.scope.forward.hint:
  pt: "a LAN saindo para a internet, uma VLAN falando com outra"
  en: "the LAN reaching the internet, one VLAN talking to another"
fw.scope.input.title:
  pt: "destinado ao firewall"
  en: "addressed to the firewall"
fw.scope.input.hint:
  pt: "SSH, este painel, DNS, Samba — o que chega na própria máquina"
  en: "SSH, this panel, DNS, Samba — what arrives at the machine itself"
fw.connState.any.title:
  pt: "toda conexão"
  en: "every connection"
fw.connState.any.hint:
  pt: "decide na hora, inclusive sobre o que já está em curso: a transferência que o host já estava fazendo cai junto"
  en: "decides right away, including what is already under way: the transfer the host had going drops with it"
fw.connState.new.title:
  pt: "só conexões novas"
  en: "new connections only"
fw.connState.new.hint:
  pt: "não derruba a transferência que já está em curso; vale para o que for aberto daqui em diante"
  en: "does not drop transfers already under way; applies to whatever is opened from now on"
fw.connState.noExpr:
  pt: "sem `ct state` na linha"
  en: "no `ct state` on the line"

# Grupos do sistema
fw.systemKind.blockedHosts.what:
  pt: "Todo tráfego ROTEADO de ou para estes hosts é descartado: eles não saem para a internet nem alcançam outra rede através do firewall. O que eles ainda alcançam é o próprio firewall (painel, SSH, DNS e DHCP), porque estas linhas ficam só na chain forward. Este grupo não tem condição de entrada nem regras: a lista de membros é o próprio conteúdo."
  en: "All ROUTED traffic from or to these hosts is dropped: they do not reach the internet nor any other network through the firewall. What they can still reach is the firewall itself (panel, SSH, DNS and DHCP), because these lines live only in the forward chain. This group has no entry condition and no rules: the member list is its whole content."
fw.systemKind.blockedHosts.member.one:
  pt: "host"
  en: "host"
fw.systemKind.blockedHosts.member.many:
  pt: "hosts"
  en: "hosts"
fw.systemKind.blockedHosts.empty:
  pt: "Nenhum host bloqueado."
  en: "No blocked hosts."
fw.systemKind.blocklist.what:
  pt: "Todo tráfego ROTEADO de ou para estes destinos é descartado — a faixa vale como origem e como destino. Estas linhas ficam só na chain forward: o que o próprio firewall inicia para esses destinos não passa por elas. Este grupo não tem condição de entrada nem regras: a lista de membros é o próprio conteúdo."
  en: "All ROUTED traffic from or to these destinations is dropped — the range counts both as source and as destination. These lines live only in the forward chain: what the firewall itself initiates towards those destinations does not go through them. This group has no entry condition and no rules: the member list is its whole content."
fw.systemKind.blocklist.member.one:
  pt: "faixa"
  en: "range"
fw.systemKind.blocklist.member.many:
  pt: "faixas"
  en: "ranges"
fw.systemKind.blocklist.empty:
  pt: "Nenhum destino bloqueado."
  en: "No blocked destinations."

