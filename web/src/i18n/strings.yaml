fw.group.inputWarning.body:
  pt: "Este grupo passa a filtrar o que chega no próprio firewall — SSH, este painel, DNS. A alteração é aplicada na hora e, se ninguém confirmar em 90 segundos, o LinkGuard desfaz os grupos e as regras sozinho."
  en: "This group starts filtering what arrives at the firewall itself — SSH, this panel, DNS. The change is applied immediately and, if nobody confirms within 90 seconds, LinkGuard undoes the groups and rules by itself."
fw.group.inputWarning.locked:
  pt: "Enquanto ela estiver aguardando confirmação, a edição de grupos e regras fica bloqueada. Tenha um segundo acesso à máquina à mão se puder."
  en: "While it awaits confirmation, editing groups and rules is locked. Keep a second way into the machine at hand if you can."
fw.group.entryCondition:
  pt: "Quando entrar neste grupo (condição de entrada)"
  en: "When to enter this group (entry condition)"
fw.group.inIface:
  pt: "Interface de entrada"
  en: "Incoming interface"
fw.group.any:
  pt: "Qualquer"
  en: "Any"
fw.group.source:
  pt: "Origem (IP/CIDR)"
  en: "Source (IP/CIDR)"
fw.group.dest:
  pt: "Destino (IP/CIDR)"
  en: "Destination (IP/CIDR)"
fw.group.anyPlaceholder:
