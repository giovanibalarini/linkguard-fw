  en: "any"
fw.group.noCondition.input:
  pt: "Sem condição, todo o tráfego destinado ao firewall entra no grupo. Só IPv4 por enquanto."
  en: "With no condition, all traffic addressed to the firewall enters the group. IPv4 only for now."
fw.group.noCondition.forward:
  pt: "Sem condição, todo o tráfego que atravessa o firewall entra no grupo. Só IPv4 por enquanto."
  en: "With no condition, all traffic crossing the firewall enters the group. IPv4 only for now."
fw.group.whichConnections:
  pt: "Para quais conexões este grupo vale"
  en: "Which connections this group applies to"
fw.group.newConnWarning.title:
  pt: "A sua sessão atual não vai cair — nem se este grupo bloquear você."
  en: "Your current session will not drop — not even if this group blocks you."
fw.group.newConnWarning.body:
  pt: "Nos 90 segundos de confirmação, testar o acesso na aba que já está aberta (ou no SSH já conectado) vai funcionar de qualquer jeito. Para testar de verdade, abra uma conexão nova: outro terminal SSH, uma aba anônima."
  en: "During the 90-second confirmation, testing access in the tab that is already open (or the SSH already connected) will work regardless. To really test it, open a fresh connection: another SSH terminal, a private tab."
fw.group.leftover:
  pt: "E o que sobrar?"
