# Área "widgets": os cartões do painel (recursos da máquina, hosts na LAN,
# quem está consumindo, links WAN, alertas abertos e o gráfico de tráfego).
#
# Prefixo obrigatório: wid.*
# Termos que NÃO são traduzidos e por isso não têm chave: nomes de interface
# (lo, enp3s0), siglas (CPU, WAN, LAN, IP, MAC), unidades (B/KB/MB/GB, ms,
# Mb/s), o rótulo `load` do load average e o nome interno do widget que aparece
# em font-mono quando o painel encontra um widget desconhecido.

# ─── Comum aos cartões ───────────────────────────────────────────────────────
wid.loading:
  pt: "Carregando…"
  en: "Loading…"
wid.view.all:
  pt: "ver todos"
  en: "view all"
wid.status.online:
  pt: "online"
  en: "online"
wid.status.offline:
  pt: "offline"
  en: "offline"
wid.status.degraded:
  pt: "degradado"
  en: "degraded"
wid.status.unknown:
  pt: "desconhecido"
  en: "unknown"

