  en: "~10s per sample (e.g. 3 ≈ 30s of a bad link)."
links.bal.degrade.cooldown:
  pt: "Intervalo mínimo entre migrações (s)"
  en: "Minimum interval between migrations (s)"
links.bal.degrade.cooldownHint:
  pt: "Evita migrar repetidamente num link que oscila."
  en: "Keeps a flapping link from triggering migration over and over."

