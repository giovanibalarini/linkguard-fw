links.domains.notObservingHelp:
  pt: "O coletor de dnstap está desligado, então esta capacidade não recebe endereço nenhum: os domínios ativos não barram nem direcionam, e os zeros de rotatividade e último acesso abaixo NÃO querem dizer que ninguém acessou. Ligue o dnstap em Serviços de rede."
  en: "The dnstap collector is off, so this capability receives no addresses at all: active domains neither block nor route, and the zeros for rotation and last seen below do NOT mean nobody visited. Turn dnstap on under Network services."
