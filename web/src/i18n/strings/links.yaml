# ─── Franquia por link (issue #126) ───────────────────────────────────────────
# GB aqui é decimal (10^9), a unidade da fatura da operadora. O texto do help
# diz isso: o admin precisa saber que o número do painel é comparável com o
# número que ele recebe, e que a medição é do firewall, não da operadora.
links.quota.title:
  pt: "Franquia dos links"
  en: "Link data allowance"
links.quota.subtitle:
  pt: "Quanto cada link já consumiu no ciclo, e aviso antes de a franquia acabar."
  en: "How much each link has used in the current cycle, with a warning before the allowance runs out."
links.quota.help.title:
  pt: "De onde vem este número"
  en: "Where this number comes from"
links.quota.help1:
  pt: "O consumo é"
  en: "Usage is"
links.quota.helpMeasuredTerm:
  pt: "medido pelo firewall"
  en: "measured by the firewall"
links.quota.help2:
  pt: ", a partir dos contadores da própria interface — os mesmos que desenham os gráficos. A operadora conta do lado dela e pode divergir um pouco. GB aqui é 10⁹, como na fatura. O LinkGuard avisa quando a franquia acaba; ele não corta tráfego."
  en: ", from the interface's own byte counters — the same ones that draw the charts. The carrier counts on its side and may differ slightly. GB here means 10⁹, as on the bill. LinkGuard warns when the allowance runs out; it does not cut traffic."
links.quota.used:
  pt: "{used} GB de {limit} GB · {pct}%"
  en: "{used} GB of {limit} GB · {pct}%"
links.quota.usedNoLimit:
  pt: "{used} GB no ciclo · sem franquia declarada"
  en: "{used} GB this cycle · no allowance set"
links.quota.cycle:
  pt: "Ciclo"
  en: "Cycle"
links.quota.define:
  pt: "Declarar franquia"
  en: "Set allowance"
links.quota.edit:
  pt: "Editar"
  en: "Edit"
links.quota.remove:
  pt: "Remover"
  en: "Remove"
links.quota.limit:
  pt: "Franquia (GB)"
  en: "Allowance (GB)"
links.quota.cycleDay:
  pt: "Fecha no dia"
  en: "Cycle day"
links.quota.alertAt:
  pt: "Avisar em (%)"
  en: "Warn at (%)"
links.quota.cycleDayHint:
  pt: "De 1 a 28 — todo mês tem dia 28, e um fechamento em 29, 30 ou 31 simplesmente não existiria em fevereiro. Mudar o dia começa um ciclo novo: o consumo já medido continua guardado, mas passa a contar a partir da nova data de fechamento."
  en: "From 1 to 28 — every month has a 28th, and a cycle day of 29, 30 or 31 would not exist in February. Changing the day starts a new cycle: usage already measured is kept, but counting restarts from the new cycle date."
links.quota.save:
  pt: "Salvar"
  en: "Save"
links.quota.cancel:
  pt: "Cancelar"
  en: "Cancel"
links.quota.error.save:
  pt: "Não foi possível salvar a franquia."
  en: "Could not save the allowance."
links.quota.error.remove:
  pt: "Não foi possível remover a franquia."
  en: "Could not remove the allowance."

# ─── DNS dinâmico por link (issue #129) ───────────────────────────────────────
# O aviso de CGNAT é o que evita horas de diagnóstico numa tela que não tem
# nada a ver com o problema: atrás dele, encaminhamento de porta não funciona
# de jeito nenhum, por mais correta que a regra esteja.
links.ddns.title:
  pt: "DNS dinâmico"
  en: "Dynamic DNS"
links.ddns.subtitle:
  pt: "Mantém um nome apontando para o endereço público de cada link — sem isso, o encaminhamento de porta aponta para um endereço que o provedor troca sem avisar."
  en: "Keeps a name pointing at each link's public address — without it, port forwarding points at an address the ISP changes without notice."
links.ddns.help.title:
  pt: "Como funciona"
  en: "How it works"
links.ddns.help1:
  pt: "O endereço é conferido a cada 5 minutos e o provedor só é avisado quando ele muda. A configuração é"
  en: "The address is checked every 5 minutes and the provider is only notified when it changes. Configuration is"
links.ddns.helpPerLinkTerm:
  pt: "por link"
  en: "per link"
links.ddns.help2:
  pt: ": numa caixa com duas WANs são dois endereços que mudam, e cada nome acompanha o seu. Quando o endereço da interface já é público, nenhum serviço externo é consultado; atrás de NAT do provedor, o firewall pergunta a um serviço externo qual é o endereço visto de fora."
  en: ": on a box with two WANs there are two addresses changing, and each name follows its own. When the interface address is already public no external service is queried; behind carrier NAT, the firewall asks an external service what address is seen from outside."
links.ddns.notSet:
  pt: "sem nome configurado"
  en: "no name configured"
links.ddns.noAddressYet:
  pt: "endereço ainda não verificado"
  en: "address not checked yet"
links.ddns.ok:
  pt: "atualizado"
  en: "up to date"
links.ddns.behindNat:
  pt: "atrás de NAT do provedor (CGNAT) — encaminhamento de porta não funciona neste link"
  en: "behind carrier NAT (CGNAT) — port forwarding does not work on this link"
links.ddns.configure:
  pt: "Configurar"
  en: "Configure"
links.ddns.edit:
  pt: "Editar"
  en: "Edit"
links.ddns.disable:
  pt: "Desativar"
  en: "Disable"
links.ddns.hostname:
  pt: "Nome que deve apontar para este link"
  en: "Name that should point at this link"
links.ddns.urlTemplate:
  pt: "URL de atualização do provedor"
  en: "Provider update URL"
links.ddns.urlHint:
  pt: "Use {hostname} e {ip} onde eles entram. O {ip} é obrigatório: sem ele o provedor usaria o endereço de quem chama, o que acerta por acidente e falha em silêncio."
  en: "Use {hostname} and {ip} where they belong. {ip} is required: without it the provider would use the caller's address, which happens to work by accident and fails silently."
links.ddns.username:
  pt: "Usuário (se o provedor exigir)"
  en: "Username (if the provider requires one)"
