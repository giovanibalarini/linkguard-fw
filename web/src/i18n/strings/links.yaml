# Área "links": página de Links WAN, balanceamento de saída e stress-test.
#
# Prefixo obrigatório: links.*
# Termos que NÃO são traduzidos e por isso não têm chave: nomes de interface
# (enp3s0), palavras do nftables/iptables (mangle, MARK, PREROUTING, fwmark,
# from all, default), siglas (IP, DNS, CIDR, LAN, WAN, VoIP) e nomes próprios
# (LinkGuard, WAN1).

