links.domains.caveat.title:
  pt: "Limites que afetam o resultado"
  en: "Limits that affect the result"
links.domains.caveat.cdn:
  pt: "CDN: um domínio pode compartilhar IP com outros serviços; bloquear ou direcionar esse IP pode afetá-los até o TTL expirar. Use ensaio e confira a rotação."
  en: "CDN: a domain may share an IP with other services; blocking or routing that IP can affect them until its TTL expires. Use trial mode and inspect rotation."
links.domains.caveat.encryptedDns:
  pt: "DoH/DoT: só respostas do resolvedor configurado e visíveis no dnstap são aprendidas. Clientes que contornam o DNS local não são cobertos sem controle separado de vazamento DNS."
  en: "DoH/DoT: only configured-resolver responses visible through dnstap are learned. Clients bypassing local DNS are not covered without separate DNS-leak controls."
links.domains.caveat.vpn:
  pt: "VPN: o firewall normalmente vê apenas o endpoint do túnel, não os domínios ou endereços internos."
  en: "VPN: the firewall normally sees only the tunnel endpoint, not inner domains or addresses."
links.domains.caveat.fixedIp:
  pt: "IP fixo ou acesso direto: sem uma resposta DNS observada não há aprendizado; use uma regra explícita de IP/CIDR."
  en: "Fixed IP or direct access: without an observed DNS response nothing is learned; use an explicit IP/CIDR rule."
links.domains.caveat.ipv6:
  pt: "IPv6: bloqueio aprende IPv4 e IPv6, mas direcionamento por domínio suporta somente IPv4; respostas IPv6 de alvos direcionados são descartadas e contabilizadas abaixo."
  en: "IPv6: blocking learns IPv4 and IPv6, but domain routing supports IPv4 only; IPv6 answers for routed targets are discarded and counted below."

