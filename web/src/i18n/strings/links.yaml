  pt: "Quando um link fica"
  en: "When a link stays"
links.bal.degrade.helpDegradedTerm:
  pt: "degradado"
  en: "degraded"
links.bal.degrade.help2:
  pt: "(ping alto / oscilando, mas ainda vivo) por várias verificações seguidas, o LinkGuard pode"
  en: "(high or erratic ping, but still up) for several checks in a row, LinkGuard can"
links.bal.degrade.helpMigrateTerm:
  pt: "migrar as conexões ativas"
  en: "move its active connections"
links.bal.degrade.help3:
  pt: "dele para um link saudável. As conexões no link ruim são"
  en: "over to a healthy link. Connections on the bad link are"
links.bal.degrade.helpResetTerm:
  pt: "reiniciadas"
  en: "reset"
links.bal.degrade.help4:
  pt: "(reconectam na hora no link bom) — ideal para chamadas/VoIP que estavam travando. Só age se houver outro link saudável."
  en: "(they reconnect immediately over the good link) — ideal for calls/VoIP that were breaking up. It only acts if another healthy link exists."
