cfg.twofa.title:
  pt: "Verificação em duas etapas (2FA)"
  en: "Two-step verification (2FA)"
cfg.twofa.help.title:
  pt: "2FA"
  en: "2FA"
cfg.twofa.help.body:
  pt: "Além da senha, pede um "
  en: "On top of the password, it asks for a "
cfg.twofa.help.body.strong:
  pt: "código que muda a cada 30s"
  en: "code that changes every 30s"
cfg.twofa.help.body.tail:
  pt: " gerado por um app autenticador (Google Authenticator, Authy, etc.). Mesmo que descubram sua senha, não entram sem o código."
  en: " generated by an authenticator app (Google Authenticator, Authy, etc.). Even if someone learns your password, they cannot get in without the code."
