  pt: "Salva num arquivo todas as suas configurações (links, firewall, DHCP/DNS, balanceamento, notificações...). Útil antes de mexer em algo ou para migrar de máquina. O arquivo é sempre cifrado com a senha configurada abaixo."
  en: "Saves every setting you have to a file (links, firewall, DHCP/DNS, load balancing, notifications). Handy before changing something or when moving to another machine. The file is always encrypted with the passphrase set below."
