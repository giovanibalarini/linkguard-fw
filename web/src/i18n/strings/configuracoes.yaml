# ─── HTTPS ───────────────────────────────────────────────────────────────────
cfg.https.title:
  pt: "Acesso ao painel (HTTPS)"
  en: "Panel access (HTTPS)"
cfg.https.help.title:
  pt: "HTTPS"
  en: "HTTPS"
cfg.https.help.body:
  pt: "HTTPS criptografa o tráfego entre o seu navegador e o painel. Importante se o painel for acessível pela internet ou por uma rede não confiável."
  en: "HTTPS encrypts the traffic between your browser and the panel. It matters if the panel is reachable from the internet or from a network you do not trust."
cfg.https.secure:
  pt: "Você está acessando via HTTPS (conexão criptografada). 🔒"
  en: "You are connected over HTTPS (encrypted connection). 🔒"
cfg.https.insecure:
  pt: "Você está acessando via HTTP — o tráfego não é criptografado."
  en: "You are connected over HTTP — the traffic is not encrypted."
cfg.https.enable:
  pt: "Para ativar o HTTPS, no arquivo "
  en: "To turn HTTPS on, in the file "
cfg.https.enable.tail:
  pt: " defina:"
  en: " set:"
cfg.https.restart:
  pt: "e reinicie o serviço: "
  en: "then restart the service: "
cfg.https.cert:
  pt: "Um certificado "
  en: "A "
cfg.https.cert.strong:
  pt: "autoassinado"
  en: "self-signed"
cfg.https.cert.tail:
  pt: " é gerado automaticamente (o navegador mostrará um aviso na 1ª vez — normal). Para um certificado confiável, aponte "
  en: " certificate is generated automatically (the browser warns you the first time — that is expected). For a trusted certificate, point "
cfg.https.cert.and:
  pt: " e "
