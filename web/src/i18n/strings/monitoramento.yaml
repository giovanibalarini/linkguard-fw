# ─── Tráfego (página) ─────────────────────────────────────────────────────────
mon.traffic.title:
  pt: "Tráfego"
  en: "Traffic"
mon.traffic.unit.prefix:
  pt: "Taxa em "
  en: "Rate in "
mon.traffic.unit.rest:
  pt: " — bits, a unidade do link, para bater com o plano contratado. O volume acumulado continua em bytes."
  en: " — bits, the unit links are sold in, so it matches the contracted plan. Accumulated volume stays in bytes."
mon.traffic.window.aria:
  pt: "Janela de tempo"
  en: "Time window"
mon.traffic.window.title:
  pt: "Últimos {label}, em passo de {step}"
  en: "Last {label}, at a {step} step"
# Os rótulos das janelas moram em lib/series.ts como dado, junto do range e do
# passo; a tradução tem de acontecer na tela, porque "30 dias"/"1 ano" são texto
# e "30m"/"12h" são id. As unidades curtas ficam iguais nos dois idiomas de
# propósito — min/h são as mesmas abreviações em inglês.
