# Área: monitoramento (Monitoring, Alertas, Logs, Tráfego, saúde do sistema).
#
# Todas as chaves desta área começam com "mon.". Termos que o admin encontra no
# sistema — RX, TX, SMART, CIDR, systemctl, /etc/nftables.conf, nomes de
# interface — não são traduzidos de propósito.

