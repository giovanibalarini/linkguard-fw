# ─── Captura de pacotes (issue #114) ──────────────────────────────────────────
# O texto aqui carrega uma promessa que precisa continuar verdadeira: a captura
# é de CABEÇALHO. Se algum dia ela passar a guardar conteúdo, estas frases são
# as primeiras que têm de mudar.
mon.capture.title:
  pt: "Captura de pacotes"
  en: "Packet capture"
mon.capture.subtitle:
  pt: "Ver o que chega e o que sai de uma interface, sem SSH — por tempo limitado e só o cabeçalho."
  en: "See what arrives at and leaves an interface, without SSH — time-boxed, headers only."
mon.capture.help.title:
  pt: "O que esta captura vê"
  en: "What this capture sees"
mon.capture.help1:
  pt: "O firewall copia apenas os primeiros 96 bytes de cada quadro, o que cobre os"
  en: "The firewall copies only the first 96 bytes of each frame, which covers the"
mon.capture.helpHeadersTerm:
  pt: "cabeçalhos"
  en: "headers"
mon.capture.help2:
  pt: " de rede e transporte. Não dá para reconstruir o conteúdo da conversa a partir disso, e esta tabela nunca mostra nada derivado de payload. O arquivo .pcap é outra coisa: em pacote de cabeçalho curto sobram alguns bytes além do cabeçalho, o suficiente para aparecer, por exemplo, o banner de um serviço — quem baixa recebe mais do que a tabela mostra. Toda captura, e todo download, ficam no log de auditoria com quem fez e qual filtro usou."
  en: " of the network and transport layers. The content of a conversation cannot be reconstructed from that, and this table never shows anything derived from payload. The .pcap file is a different matter: on packets with short headers a few bytes beyond the header remain, enough for a service banner to show up, for instance — whoever downloads it gets more than the table shows. Every capture, and every download, is recorded in the audit log with who did it and which filter was used."
mon.capture.notInstalled:
  pt: "O tcpdump não está instalado nesta máquina — ele é quem faz a captura."
  en: "tcpdump is not installed on this machine — it is what performs the capture."
