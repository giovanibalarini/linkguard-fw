# Área "servicos": DHCP, DNS (+ log de consultas), NTP e Hosts da rede.
#
# Todas as chaves daqui começam com "svc.". Chaves genéricas de botão
# (Salvar/Cancelar/Carregando) NÃO são redefinidas aqui — vêm de common.yaml.
#
# Não traduzir: nomes próprios (LinkGuard, Kea, unbound, chrony, Debian,
# Pi-hole), siglas técnicas (DHCP, DNS, NTP, MAC, CIDR, LAN, VLAN, NXDOMAIN,
# I/O), termos do protocolo (lease, stratum, offset, upstream/forwarder) e
# valores de exemplo (aa:bb:cc:dd:ee:ff, 1.1.1.1).

