# ─── Faixa do confirmar-ou-reverte (em qualquer tela) ────────────────────────
shell.pending.unknown.text:
  pt: "Não foi possível saber se há uma alteração de firewall aguardando confirmação. Se você acabou de aplicar uma, ela pode estar contando os 90 segundos agora —"
  en: "Could not tell whether a firewall change is waiting for confirmation. If you have just applied one, its 90 seconds may be running right now —"
shell.pending.unknown.link:
  pt: "abra os grupos de regras"
  en: "open the rule groups"
shell.pending.reverting:
  pt: "Uma alteração de firewall está sendo revertida ({summary}). Os grupos e as regras já voltaram ao estado anterior; falta o firewall aceitar, e o LinkGuard repete até conseguir."
  en: "A firewall change is being reverted ({summary}). The groups and rules are already back to their previous state; the firewall still has to accept them, and LinkGuard keeps retrying until it does."
shell.pending.seeOnFirewall:
  pt: "Ver na tela de firewall"
  en: "See it on the firewall screen"
shell.pending.revertsIn:
  pt: "reverte em"
  en: "reverts in"
shell.pending.waiting.text:
  pt: "Uma alteração no tráfego destinado ao próprio firewall aguarda confirmação —"
  en: "A change to the traffic addressed to the firewall itself is waiting for confirmation —"
shell.pending.waiting.tail:
  pt: ". Teste o acesso que importa (SSH, este painel) antes de confirmar."
  en: ". Test the access that matters (SSH, this panel) before you confirm."
shell.pending.newConnOnly.lead:
  pt: "Este grupo vale só para conexões novas."
  en: "This group applies to new connections only."
shell.pending.newConnOnly.strong:
  pt: "A sua sessão atual não é afetada"
  en: "Your current session is not affected"
shell.pending.newConnOnly.tail:
  pt: " — abra uma conexão nova (outro terminal SSH, uma aba anônima) para testar de verdade antes de confirmar."
  en: " — open a fresh connection (another SSH terminal, a private browser tab) to really test it before you confirm."
shell.pending.error:
  pt: "Erro: {msg}"
  en: "Error: {msg}"
shell.pending.opFailed:
  pt: "falha na operação"
  en: "the operation failed"
shell.pending.staleRead:
  pt: "O painel não conseguiu reler o estado desta janela agora — o que está acima é a última leitura boa. Continua tentando."
  en: "The panel could not re-read the state of this window just now — what you see above is the last good read. It keeps retrying."
shell.pending.confirm:
  pt: "Confirmar acesso"
  en: "Confirm access"
shell.pending.revertNow:
  pt: "Reverter agora"
  en: "Revert now"

