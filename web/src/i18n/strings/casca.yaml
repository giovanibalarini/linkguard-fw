# Área "casca": o que envolve todas as telas — menu lateral, painel de widgets,
# faixa do confirmar-ou-reverte, login, novidades, atualização do sistema e as
# duas peças de UI compartilhadas (HelpTip, Combo).
#
# Prefixo obrigatório: shell.*
# Termos que NÃO são traduzidos e por isso não têm chave: nomes próprios
# (LinkGuard, GitHub, admin), siglas (SSH, PAT, DHCP), nomes de comando e de
# serviço (linkguard-fw), o prefixo do token (ghp_) e os nomes dos idiomas no
# seletor (Português/English), que precisam ser legíveis nos dois idiomas.

