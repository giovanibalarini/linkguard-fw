# ─── Janela de horário do grupo (issue #125) ──────────────────────────────────
# O aviso do fuso não é detalhe: "22:00" é a hora DO FIREWALL, e o admin pode
# estar configurando de um computador em outro fuso.
fw.group.schedule.title:
  pt: "Janela de horário (opcional)"
  en: "Time window (optional)"
fw.group.schedule.explain:
  pt: "Fora da janela, o grupo inteiro deixa de valer — as regras dentro dele não são nem consultadas. Sem dia marcado vale todos os dias; sem horário vale o dia inteiro."
  en: "Outside the window the whole group stops applying — the rules inside it are not even consulted. With no day selected it applies every day; with no time it applies all day."
