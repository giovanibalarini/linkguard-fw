  pt: "remover janela"
  en: "clear window"
fw.group.schedule.hint:
  pt: "Horário do firewall, não do seu computador. Faixa que atravessa a meia-noite é válida (22:00 até 06:00)."
  en: "The firewall's clock, not your computer's. A window crossing midnight is valid (22:00 to 06:00)."
